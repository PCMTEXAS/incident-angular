<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80" role="img" aria-label="DigitalChalk">
  <!-- Icon: DC purple (#201A56) square on light background -->
  <rect x="0" y="6" width="58" height="58" rx="10" fill="#201A56"/>
  <text x="29" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
  <rect x="4" y="68" width="50" height="3" rx="1.5" fill="#2CAAE1"/>
  <!-- "Digital" — DC purple -->
  <text x="74" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" fill="#201A56" letter-spacing="-0.3">Digital</text>
  <!-- "Chalk" — DC blue -->
  <text x="74" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="300" fill="#2CAAE1" letter-spacing="0.8">Chalk</text>
</svg>
