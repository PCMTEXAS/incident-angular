<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80" role="img" aria-label="DigitalChalk">
  <!-- Icon: rounded square with chalk-mark D -->
  <rect x="0" y="6" width="58" height="58" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="29" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
  <!-- Chalk stroke underline -->
  <rect x="4" y="68" width="50" height="3" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <!-- "Digital" wordmark -->
  <text x="74" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Digital</text>
  <!-- "Chalk" wordmark in accent -->
  <text x="74" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="300" fill="#7dd3f8" letter-spacing="0.8">Chalk</text>
</svg>
