<div class="login-page d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card card p-4 p-md-5 shadow-lg" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <div class="login-logo mb-3">
        <i class="bi bi-shield-check text-blue" style="font-size: 2.5rem;"></i>
      </div>
      <h1 class="h4 fw-bold text-blue mb-1">PCMHub</h1>
      <p class="text-muted small mb-0">Incident Management Platform</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger py-2 small d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #form="ngForm">
      <div class="mb-3">
        <label class="form-label" for="userId">User ID</label>
        <input
          id="userId"
          type="text"
          class="form-control"
          [(ngModel)]="userId"
          name="userId"
          autocomplete="username"
          placeholder="Enter your user ID"
          [disabled]="loading()"
          required>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          [disabled]="loading()"
          required>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 fw-semibold"
        [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2"></span>Signing in…
        } @else {
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        }
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      Contact your administrator to reset your password or create an account.
    </p>
  </div>
</div>
